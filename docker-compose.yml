services:
  telegram-autoreply:
    build: .
    container_name: telegram-business-autoreply
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - STATUS_PORT=8080
      - MAX_CONCURRENT_UPDATES=${MAX_CONCURRENT_UPDATES:-32}
    ports:
      - "18080:8080"
